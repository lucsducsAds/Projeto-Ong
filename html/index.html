<!DOCTYPE html>

<head>

    <title>Instituto Viver Melhor</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="site-header">

        <a class="logo" href="#inicio" aria-label="Instituto Viver Melhor - página inicial">
            <span class="logo-mark" aria-hidden="true">IVM</span>
            <span>Instituto Viver Melhor</span>
        </a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-principal">
            <span class="menu-icon" aria-hidden="true">☰</span>
            <span class="menu-label">Menu</span>
        </button>
        <nav class="main-nav" aria-label="Navegação principal">
            <ul class="nav-list" id="menu-principal">
                <li><a href="#inicio" data-route="inicio">Início</a></li>
                <li class="has-submenu">

    <strong>Cadastro validado</strong><br>
    Seu interesse foi registrado nesta demonstração do projeto.
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/projetos.js"></script>
<script src="../js/form.js"></script>
<script src="../js/menu.js"></script>
<script src="../js/app.js"></script>
